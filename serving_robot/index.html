<!doctype html><html lang="ja"><meta charset="utf-8"><title>配膳空間マッピング</title><style>
body{font-family:system-ui;background:#101c2b;color:#e4edf8;max-width:1120px;margin:28px auto;padding:0 20px}h1{font-size:28px}main{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}svg{background:#eaf1f5;border-radius:16px;width:100%}section{background:#1c2c40;padding:22px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:12px;font-size:16px}button{padding:12px 18px;margin:10px 6px 10px 0;border:0;border-radius:8px;cursor:pointer}button.stop{background:#fdad90}button.confirm{background:#84e1bd}button:disabled{opacity:.4;cursor:default}pre{white-space:pre-wrap}small{color:#b9cadb}#proposal{border:1px solid #dca34a;padding:12px;border-radius:10px;margin-top:16px}#error{color:#ffd3a5}@media(max-width:700px){main{display:block}}</style>
<h1>配膳空間マッピング</h1><p>既知の部屋の地図から候補を作り、確認してから移動します。上下左右は画面基準です。</p><main><svg viewBox="0 0 600 600" id="map" aria-label="部屋と配膳ロボット、移動先候補"></svg><section><strong id="backend"></strong><p>例：2番テーブルと3番テーブルの間へ<br>1番の近くへ ／ 部屋の右上へ<br>「一番テーブル」「一番卓」も同じ行先です。</p><form id="form" autocomplete="off"><input id="text" autocomplete="off" maxlength="500" placeholder="行先と位置関係を入力" aria-label="配膳指示"><button id="submit">候補を作る</button></form><p id="error" role="status" aria-live="polite" aria-atomic="true"></p><div id="proposal" hidden><strong id="candidate-label"></strong><p id="candidate-detail"></p><button class="confirm" id="confirm" disabled>この候補へ移動</button><button id="cancel" disabled>候補を取り消す</button></div><button class="stop" id="stop">走行中の停止</button><pre id="info"></pre><small>青：台車　橙：テーブル・障害物<br>黄：未確認の候補と経路　緑：移動中の経路<br>6 × 6 m、速度目標上限 0.35 m/s。<br>曖昧・矛盾・存在しない行先は確認待ちになります。</small></section></main>
<script>
const $=id=>document.getElementById(id),names={kitchen:'厨房',table1:'1番テーブル',table2:'2番テーブル',table3:'3番テーブル'};let candidateId=null,displayedEpoch=-1,pollSequence=0,appliedPoll=0,operation=0,mutating=0,localErrorOperation=-1,localErrorEpoch=-1;
async function send(path,body={}){const version=++operation;mutating++;localErrorOperation=-1;$('error').textContent='';clearCandidate();try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok&&version===operation){localErrorOperation=version;localErrorEpoch=displayedEpoch;$('error').textContent=data.error||'操作に失敗しました。入力を確認して、もう一度お試しください。';}}catch(e){if(version===operation){localErrorOperation=version;localErrorEpoch=displayedEpoch;$('error').textContent='接続エラー。サーバーの状態を確認して、もう一度お試しください。';}}finally{mutating--;}}
function clearCandidate(){candidateId=null;$('confirm').disabled=true;$('cancel').disabled=true;$('proposal').hidden=true;}
$('form').onsubmit=e=>{e.preventDefault();clearCandidate();$('error').textContent='';send('/command',{text:$('text').value});};
$('stop').onclick=()=>{clearCandidate();send('/stop');};
for(const action of ['confirm','cancel'])$(action).onclick=()=>{const id=candidateId;clearCandidate();if(id)send('/'+action,{candidate_id:id});};
async function draw(){const seq=++pollSequence,version=operation;try{const s=await(await fetch('/state',{cache:'no-store'})).json();if(mutating||version!==operation||seq<appliedPoll||s.epoch<displayedEpoch)return;appliedPoll=seq;displayedEpoch=s.epoch;
if(s.epoch>localErrorEpoch)localErrorOperation=-1;
if(localErrorOperation!==operation)$('error').textContent=(s.intent.action==='clarify'||s.status==='clarify')?s.intent.message:'';
$('backend').textContent=s.intent.backend==='mock'?'MOCK · 実AI未使用':'LOCAL AI · '+s.intent.model;
$('info').textContent=`状態: ${s.status}\n速度: ${s.speed.toFixed(3)} m/s\n位置: (${s.x.toFixed(2)}, ${s.y.toFixed(2)}) m\n${s.intent.message}\n解釈時間: ${s.intent.latency_seconds?.toFixed(2)??'—'} s`;
const c=s.candidate;candidateId=c?.id??null;$('proposal').hidden=!c;$('confirm').disabled=!c||s.speed>.01;$('cancel').disabled=!c;
if(c){$('candidate-label').textContent=c.label;$('candidate-detail').textContent=`候補: (${c.point.map(v=>v.toFixed(2)).join(', ')}) m。${c.explanation} 確認するまで移動しません。`;}
let h='<rect x="3" y="3" width="594" height="594" rx="10" fill="none" stroke="#7f93a5" stroke-width="6"/><text x="15" y="25" font-size="14">画面 左上</text><text x="510" y="25" font-size="14">右上</text><text x="15" y="580" font-size="14">左下</text><text x="510" y="580" font-size="14">右下</text>';
for(let [x,y,w,d] of s.boxes)h+=`<rect x="${(x-w)*100}" y="${(6-y-d)*100}" width="${w*200}" height="${d*200}" fill="#e8ad6d" rx="4"/>`;
for(let [k,[x,y]] of Object.entries(s.goals))h+=`<circle cx="${x*100}" cy="${(6-y)*100}" r="7" fill="#9db5c8"/><text x="${x*100-24}" y="${(6-y)*100-20}" font-size="16">${names[k]}</text>`;
const line=(path,color,dash='')=>`<polyline points="${path.map(([x,y])=>`${x*100},${(6-y)*100}`).join(' ')}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${dash}"/>`;
h+=line(s.path,'#19a780');if(c){h+=line(c.path,'#c48a18','8 5');h+=`<circle cx="${c.point[0]*100}" cy="${(6-c.point[1])*100}" r="24" fill="#f9cc5c" fill-opacity=".5" stroke="#b77c00" stroke-width="3"/>`;}
h+=`<circle cx="${s.x*100}" cy="${(6-s.y)*100}" r="22" fill="#198bbd" stroke="white" stroke-width="4"/>`;$('map').innerHTML=h;
}catch(e){if(version===operation&&!mutating&&seq>=appliedPoll){clearCandidate();$('error').textContent='サーバーに接続できません。再接続後に候補を確認してください。';$('info').textContent=$('error').textContent;}}finally{setTimeout(draw,150)}}draw();
</script></html>
